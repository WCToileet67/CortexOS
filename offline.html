<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CortexOS offline</title>
    <link rel="stylesheet" href="style.css" />
    <meta name="theme-color" content="#1a1a2e" />
</head>
<body>
    <main class="offline-page">
        <div class="offline-card">
            <div class="offline-logo">CORTEX<span>OS</span></div>
            <h1>Jesteś offline</h1>
            <p>CortexOS jest gotowy do działania lokalnie. Połącz się z internetem i odśwież stronę, aby pobrać najnowsze pliki.</p>
            <button type="button" onclick="location.reload()">Spróbuj ponownie</button>
        </div>
    </main>
</body>
</html>
